<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças Pessoais</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("tema"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Navegação principal">
    <button id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login" tabindex="0">Login</button>
    <button id="tab-lancamentos" role="tab" aria-selected="false" aria-controls="panel-lancamentos" tabindex="-1">Lançamentos</button>
    <button id="tab-fontes" role="tab" aria-selected="false" aria-controls="panel-fontes" tabindex="-1">Fontes/Destinos</button>
    <button id="tab-categorias" role="tab" aria-selected="false" aria-controls="panel-categorias" tabindex="-1">Categorias</button>
    <button id="tab-relatorios" role="tab" aria-selected="false" aria-controls="panel-relatorios" tabindex="-1">Relatórios</button>
    <button id="tab-saude" role="tab" aria-selected="false" aria-controls="panel-saude" tabindex="-1">Saúde Financeira</button>
    <button id="btn-tema" type="button" class="tema-toggle" aria-label="Alternar tema" title="Alternar tema">🌓</button>
    <a href="../" class="doc-link" title="documentação da API" style="margin-left:0.5rem;padding:0.875rem 1rem;font-weight:500;white-space:nowrap;">Documentação</a>
  </nav>

  <main>
    <section id="panel-login" role="tabpanel" aria-labelledby="tab-login" class="panel active">
      <!-- Login form will be rendered here by app.js -->
    </section>

    <section id="panel-lancamentos" role="tabpanel" aria-labelledby="tab-lancamentos" class="panel" hidden>
      <!-- Lançamentos UI will be rendered here by app.js -->
    </section>

    <section id="panel-fontes" role="tabpanel" aria-labelledby="tab-fontes" class="panel" hidden>
      <!-- Fontes/Destinos UI will be rendered here by app.js -->
    </section>

    <section id="panel-categorias" role="tabpanel" aria-labelledby="tab-categorias" class="panel" hidden>
      <!-- Categorias UI will be rendered here by app.js -->
    </section>

    <section id="panel-relatorios" role="tabpanel" aria-labelledby="tab-relatorios" class="panel" hidden>
      <!-- Relatórios UI will be rendered here by app.js -->
    </section>

    <section id="panel-saude" role="tabpanel" aria-labelledby="tab-saude" class="panel" hidden>
      <!-- Saúde Financeira UI will be rendered here by app.js -->
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
